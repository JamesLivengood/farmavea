shared: &shared
  daily_price_update:
    class: DailyPriceUpdateJob
    queue: crawling
    schedule: every day at 5am America/Mexico_City

  # The privacy notice promises chat messages are deleted after
  # ChatConversation::RETENTION; this is what keeps that true.
  purge_old_chat_conversations:
    class: PurgeOldChatConversationsJob
    queue: default
    schedule: every day at 4:20am America/Mexico_City

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
